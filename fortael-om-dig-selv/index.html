<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortæl om dig selv · Dansk A1–A2</title><style>
:root{--bg:#f6f4ed;--ink:#233b38;--green:#256e66;--line:#d9ded8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,Arial}header{background:#1b514a;color:white;padding:26px 5vw}h1{margin:0;font-size:clamp(27px,4vw,42px)}header p{margin:4px 0}main{max-width:1150px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:20px}nav{background:white;border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:12px;align-self:start;max-height:90vh;overflow:auto}nav button{display:block;width:100%;padding:10px;border:0;border-radius:8px;background:transparent;text-align:left;color:inherit;cursor:pointer}nav button.active,nav button:hover{background:#dcece4;font-weight:700}.page{display:none}.page.active{display:block}.panel{background:white;padding:24px;margin-bottom:17px;border:1px solid var(--line);border-radius:17px}h2{margin-top:0}h3{margin:8px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid var(--line)}th{background:#eef4ed}.question{padding:12px 0;border-bottom:1px solid #e2e8e3}.question label{display:block;font-weight:600;margin-bottom:5px}input,select,textarea{font:inherit;padding:10px;border-radius:9px;border:1px solid #b9c9c2;max-width:100%;width:100%;background:white}textarea{min-height:150px;resize:vertical}.reading,.tip{padding:18px;background:#f1f7f2;border-left:4px solid var(--green);border-radius:10px}.tip{background:#fff6e6;border-color:#e0a54f}button.action{background:var(--green);color:white;border:0;padding:10px 16px;border-radius:9px;font-weight:700;cursor:pointer}button.alt{background:white;color:var(--green);border:1px solid var(--green)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.result{font-weight:700}.ok{color:#167548}.bad{color:#b74343}.meter{height:9px;background:#a9c9ba;border-radius:9px;overflow:hidden;margin:10px 0}.meter span{display:block;background:#e0a54f;height:100%;width:0}.card{padding:24px;text-align:center;background:#edf5ef;border-radius:12px;font-size:24px;font-weight:700;min-height:140px;display:grid;place-items:center}@media(max-width:800px){main{display:block}nav{position:static;display:flex;gap:5px;overflow-x:auto;white-space:nowrap;margin-bottom:14px}nav button{width:auto;flex-shrink:0}.panel{padding:17px}}@media print{nav,.actions{display:none!important}main{display:block}.page{display:block!important}}
</style></head><body><header><small>DANSK · A1–A2 · VOKSNE</small><h1>Fortæl om dig selv</h1><p>Ordforråd, grammatik, 3 læsetekster og 15 opgaver · Vælg opgaver i valgfri rækkefølge</p><div class="meter"><span id="bar"></span></div><small id="progress">0 af 15 opgaver besøgt</small></header><main><nav id="nav"></nav><div id="pages"></div></main><script>
const pages=[],saved=JSON.parse(localStorage.getItem('fortael-answers')||'{}'),visited=JSON.parse(localStorage.getItem('fortael-visited')||'[]');
const add=(title,html)=>pages.push({title,html});
const p=(title,html)=>'<article class="panel"><h2>'+title+'</h2>'+html+'</article>';
const tab=(head,rows)=>'<table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const list=a=>'<ol>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ol>';
const fields=(id,qs)=>qs.map((q,i)=>'<div class="question"><label>'+(i+1)+'. '+q+'</label><input data-key="'+id+'-'+i+'" placeholder="Skriv dit svar"></div>').join('');
const essay=(id,placeholder='Skriv her ...')=>'<textarea data-key="'+id+'" placeholder="'+placeholder+'"></textarea>'+buttons(id,false);
const buttons=(id,check=true)=>'<div class="actions">'+(check?'<button class="action" onclick="check(\''+id+'\')">Tjek svar</button>':'')+'<button class="action alt" onclick="clearGroup(\''+id+'\')">Slet alle svar</button><span class="result" id="result-'+id+'"></span></div>';
const ex=(n,t,html)=>add('Opgave '+n+': '+t,p('Opgave '+n+' – '+t,html));
const vocabulary=[['Personlige oplysninger','navn, alder, land, by, adresse, nationalitet'],['Familie','mand, kone, kæreste, børn, søn, datter, forældre, søskende'],['Arbejde','arbejde, job, kollega, chef, arbejdsplads, uddannelse'],['Fritid','læse, gå ture, træne, lave mad, rejse, se film'],['Sprog','tale, forstå, lære, øve, skrive, læse'],['Personlighed','glad, rolig, venlig, aktiv, social, genert']];
const useful=['Jeg hedder ...','Jeg er ... år gammel.','Jeg kommer fra ..., men jeg bor i ...','Jeg har boet i Danmark i ... år.','Jeg er gift / single / skilt.','Jeg har ... børn.','Jeg arbejder som ...','Jeg går på danskkursus.','I min fritid kan jeg godt lide at ...','Jeg lærer dansk, fordi ...'];
const verb=[['at bo','bor','Jeg bor i Odense.'],['at arbejde','arbejder','Hun arbejder på et kontor.'],['at tale','taler','Vi taler dansk.'],['at lære','lærer','Han lærer dansk.'],['at læse','læser','Jeg læser bøger.'],['at have','har','Jeg har to børn.'],['at være','er','Jeg er 35 år.'],['at komme','kommer','Hun kommer fra Polen.']];
const hv=[['Hvad','Hvad hedder du?'],['Hvor','Hvor bor du?'],['Hvor','Hvor kommer du fra?'],['Hvor gammel','Hvor gammel er du?'],['Hvem','Hvem bor du sammen med?'],['Hvor mange','Hvor mange børn har du?'],['Hvornår','Hvornår går du på arbejde?'],['Hvorfor','Hvorfor lærer du dansk?']];
add('Start og ordforråd',p('Velkommen!', '<p>Fortæl om dig selv på dansk. Du kan vælge opgaver frit og gå tilbage når du vil. Svar gemmes automatisk i din browser.</p><p><b>Læringsmål:</b> Præsentér dig selv, fortæl om familie, arbejde, fritid, hverdag og stil spørgsmål til andre.</p><div class="actions"><button class="action" onclick="show(1)">Start opgave 1 →</button></div>')+p('Ordforråd – Om mig',tab(['Emne','Nyttige ord og udtryk'],vocabulary))+p('Nyttige sætninger',list(useful)));
ex(1,'Gør sætningerne færdige',fields('task1',['Jeg hedder __________.','Jeg kommer fra __________.','Jeg har boet i Danmark i __________.','Jeg bor sammen med __________.','Jeg arbejder som __________.','Jeg taler __________.','I min fritid kan jeg godt lide at __________.','Jeg lærer dansk, fordi __________.'])+buttons('task1',false));
const verbs=['Jeg ___ i København. (bo)|bor','Min mand ___ som kok. (arbejde)|arbejder','Vi ___ dansk hver dag. (tale)|taler','Hun ___ to børn. (have)|har','Jeg ___ fra Spanien. (komme)|kommer','Mine børn ___ i skole. (gå)|går','Han ___ 42 år gammel. (være)|er','Jeg ___ dansk på sprogskolen. (lære)|lærer'];
ex(2,'Verber i nutid','<p>Mange verber slutter på <b>-r</b> i nutid.</p>'+tab(['Navnemåde','Nutid','Eksempel'],verb)+fields('task2',verbs.map(x=>x.split('|')[0]))+buttons('task2'));
ex(3,'Ordstilling','<p>Verbet står på plads 2 i en almindelig hovedsætning.</p><div class="tip"><b>Jeg | bor | i Aarhus.</b><p><b>Nu | bor | jeg i Aarhus.</b></p></div><p>Sæt ordene i den rigtige rækkefølge.</p>'+fields('task3',['bor / jeg / i Danmark','arbejder / min kone / på et hospital','i weekenden / jeg / spiller / fodbold','dansk / vi / lærer / hver dag','om aftenen / ser / jeg / fjernsyn','har / jeg / to søstre','i min fritid / jeg / læser / bøger','fra Syrien / kommer / min ven'])+buttons('task3',false));
ex(4,'Skriv spørgsmålene',tab(['Spørgeord','Eksempel'],hv)+'<p>Skriv et passende spørgsmål til hvert svar.</p>'+fields('task4',['________? – Jeg hedder Maria.','________? – Jeg kommer fra Ukraine.','________? – Jeg er 38 år.','________? – Jeg bor i Roskilde.','________? – Jeg arbejder som sygeplejerske.','________? – Jeg har tre børn.','________? – Jeg taler engelsk og dansk.','________? – Fordi jeg gerne vil arbejde i Danmark.'])+buttons('task4',false));
const anna='Jeg hedder Anna, og jeg er 36 år gammel. Jeg kommer fra Ukraine, men nu bor jeg i Danmark. Jeg bor i Roskilde sammen med min mand og vores datter. Min datter er otte år gammel. Jeg arbejder i en butik. Jeg taler ukrainsk, engelsk og lidt dansk. I min fritid kan jeg godt lide at lave mad og gå ture med min familie.';
ex(5,'Læs om Anna (A1)','<div class="reading">'+anna+'</div><h3>Svar på spørgsmålene</h3>'+fields('task5',['Hvor gammel er Anna?','Hvor kommer hun fra?','Hvor bor hun?','Hvem bor hun sammen med?','Hvor arbejder hun?','Hvilke sprog taler hun?','Hvad laver hun i sin fritid?'])+buttons('task5',false));
const mehmet='Mit navn er Mehmet. Jeg er 42 år, og jeg kommer fra Tyrkiet. Jeg har boet i Danmark i fem år. Jeg er gift og har to børn. Min kone arbejder på et hospital, og jeg arbejder som chauffør. Jeg møder på arbejde klokken syv om morgenen. Efter arbejde henter jeg ofte mine børn. Om aftenen laver vi mad og spiser sammen. I weekenden spiller jeg fodbold med mine venner. Jeg lærer dansk, fordi jeg gerne vil tale bedre med mine kolleger.';
const tf=['Mehmet har boet i Danmark i fem år.|Rigtigt','Han har tre børn.|Forkert','Hans kone arbejder på et hospital.|Rigtigt','Han begynder på arbejde klokken ni.|Forkert','Han spiller fodbold i weekenden.|Rigtigt','Han lærer dansk for at tale med sine kolleger.|Rigtigt'];
ex(6,'Læs om Mehmet (A1–A2)','<div class="reading">'+mehmet+'</div><h3>Rigtigt eller forkert?</h3>'+tf.map((x,i)=>'<div class="question"><label>'+(i+1)+'. '+x.split('|')[0]+'</label><select data-key="task6-'+i+'"><option value="">Vælg svar</option><option>Rigtigt</option><option>Forkert</option></select><small id="feedback-task6-'+i+'"></small></div>').join('')+buttons('task6'));
const sofia='Jeg hedder Sofia, og jeg er 29 år. Jeg er født i Spanien, men jeg flyttede til Danmark for tre år siden. Nu bor jeg alene i en lejlighed i København. Jeg er uddannet lærer, men lige nu arbejder jeg på en café. Jeg går også på danskkursus to gange om ugen. Jeg synes, dansk er lidt svært, især udtalen. Jeg kan godt lide at møde nye mennesker, og i min fritid træner jeg, læser bøger og besøger mine venner. Jeg håber, at jeg kan få arbejde som lærer i fremtiden.';
ex(7,'Læs om Sofia (A2)','<div class="reading">'+sofia+'</div><h3>Forstå teksten</h3>'+fields('task7',['Hvornår flyttede Sofia til Danmark?','Bor hun alene eller sammen med nogen?','Hvad er hun uddannet som?','Hvor arbejder hun nu?','Hvor tit går hun på danskkursus?','Hvad synes hun er svært ved dansk?','Hvad kan hun godt lide at lave?','Hvad håber hun på i fremtiden?'])+buttons('task7',false));
const min=['___ navn er Peter.|mit','___ børn går i skole.|mine','___ kone arbejder i en bank.|min','___ arbejde er spændende.|mit','___ venner bor i København.|mine','___ søster er 30 år.|min','___ hus ligger i Aarhus.|mit','___ forældre bor i Polen.|mine'];
ex(8,'Min, mit, mine',tab(['Ord','Eksempel'],[['min','min mand, min kone, min familie'],['mit','mit barn, mit arbejde, mit navn'],['mine','mine børn, mine venner, mine kolleger']])+min.map((x,i)=>'<div class="question"><label>'+(i+1)+'. '+x.split('|')[0]+'</label><select data-key="task8-'+i+'"><option value="">Vælg</option><option>min</option><option>mit</option><option>mine</option></select><small id="feedback-task8-'+i+'"></small></div>').join('')+buttons('task8'));
ex(9,'Min præsentation (A1)','<p>Skriv 8–10 sætninger om dig selv. Hvad hedder du, og hvor gammel er du? Hvor kommer du fra? Hvor bor du nu? Har du familie i Danmark? Arbejder du, eller går du i skole? Hvilke sprog taler du? Hvad laver du i din fritid?</p>'+essay('task9','Jeg hedder ... Jeg kommer fra ...'));
ex(10,'Længere tekst (A2)','<p>Skriv 100–120 ord om dig selv: livet før Danmark, dit arbejde eller din uddannelse, en almindelig dag, hvad du kan lide ved Danmark, hvad der er svært, og fremtidsplaner.</p><p><b>Brug:</b> fordi, men, også, nogle gange, normalt, i fremtiden.</p>'+essay('task10'));
const speak=['Hvad hedder du?','Hvor kommer du fra?','Hvor længe har du boet i Danmark?','Hvor bor du nu?','Bor du alene eller sammen med nogen?','Har du børn eller søskende?','Hvad arbejder du med?','Hvad laver du på en almindelig hverdag?','Hvilke sprog taler du?','Hvorfor lærer du dansk?','Hvad synes du om at bo i Danmark?','Hvad kan du godt lide at lave i din fritid?','Hvad laver du normalt i weekenden?','Hvad er din yndlingsmad?','Kan du godt lide at rejse?','Hvad er vigtigt for dig i livet?','Hvad vil du gerne blive bedre til?','Hvad drømmer du om i fremtiden?'];
ex(11,'Interview din partner','<p>Arbejd sammen to og to. Stil spørgsmål, lyt til svarene, og stil et ekstra spørgsmål.</p><small id="counter">Spørgsmål 1 af 18</small><div class="card" id="card">'+speak[0]+'</div><div class="actions"><button class="action alt" onclick="move(-1)">← Forrige</button><button class="action" onclick="move(1)">Næste →</button></div><details><summary>Vis alle spørgsmål</summary>'+list(speak)+'</details>');
ex(12,'Præsenter din partner','<p>Fortæl klassen om din partner. Brug <b>han/hun</b>.</p><div class="tip">Min partner hedder Ali. Han kommer fra Iran og har boet i Danmark i fire år. Han bor i Hillerød sammen med sin familie. Han arbejder som elektriker. I sin fritid kan han godt lide at cykle og spille fodbold. Han lærer dansk, fordi han gerne vil tale bedre med sine kolleger.</div>'+essay('task12','Min partner hedder ...'));
ex(13,'Find og ret fejlene','<p>Der er én grammatisk fejl i hver sætning.</p>'+fields('task13',['Jeg har 35 år.','Hun bor på København.','Jeg arbejde på et kontor.','I weekenden jeg besøger mine venner.','Mit kone arbejder som lærer.','Jeg kommer fra i Ukraine.','Jeg kan godt lide læse bøger.','Mine barn går i skole.','Hvor du arbejder?','Jeg lærer dansk, fordi jeg vil gerne finde et arbejde.'])+buttons('task13',false));
ex(14,'Gør sætningerne længere','<div class="tip">Eksempel: Jeg bor i Danmark. → Jeg bor i Danmark sammen med min familie, fordi jeg arbejder her.</div>'+fields('task14',['Jeg arbejder.','Jeg lærer dansk.','Jeg har en familie.','Jeg kan godt lide at lave mad.','Jeg går ture.','Jeg bor i en lejlighed.','Jeg taler flere sprog.','Jeg vil gerne have et nyt arbejde.'])+buttons('task14',false));
ex(15,'Min mini-præsentation','<p>Tal i cirka 2 minutter uden at læse op. Fortæl om navn, baggrund, familie, arbejde eller uddannelse, fritid og fremtidsplaner. Brug mindst tre tidsudtryk (<i>hver dag, i weekenden, nogle gange</i>) og én sætning med <i>fordi</i>.</p><label><input style="width:auto" type="checkbox" data-key="task15-done"> Jeg har gennemført min præsentation</label><h3>Stikord</h3>'+essay('task15')+'<h3>Mine læringsmål</h3>'+list(['Jeg kan fortælle, hvad jeg hedder, og hvor jeg kommer fra.','Jeg kan fortælle om min familie og mit arbejde.','Jeg kan bruge verber i nutid.','Jeg kan bruge min, mit og mine.','Jeg kan stille spørgsmål til en anden person.','Jeg kan skrive en kort tekst om mig selv.','Jeg kan præsentere mig selv mundtligt.']));
const correct={task2:verbs.map(x=>x.split('|')[1]),task6:tf.map(x=>x.split('|')[1]),task8:min.map(x=>x.split('|')[1])};
pages.forEach((page,i)=>{const b=document.createElement('button');b.textContent=page.title;b.onclick=()=>show(i);b.id='nav'+i;document.getElementById('nav').appendChild(b);const s=document.createElement('section');s.id='page'+i;s.className='page';s.innerHTML=page.html+'<div class="actions"><button class="action alt" onclick="show('+Math.max(0,i-1)+')">← Forrige</button><button class="action" onclick="show('+Math.min(pages.length-1,i+1)+')">Næste →</button><button class="action alt" onclick="exportAnswers()">Eksportér mine svar</button></div>';document.getElementById('pages').appendChild(s)});
function show(i){document.querySelectorAll('.page').forEach((e,j)=>e.classList.toggle('active',i===j));document.querySelectorAll('nav button').forEach((e,j)=>e.classList.toggle('active',i===j));if(i>0&&!visited.includes(i)){visited.push(i);localStorage.setItem('fortael-visited',JSON.stringify(visited))}document.getElementById('bar').style.width=visited.length/15*100+'%';document.getElementById('progress').textContent=visited.length+' af 15 opgaver besøgt';window.scrollTo(0,0)}
document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;if(saved[k]!==undefined){if(el.type==='checkbox')el.checked=!!saved[k];else el.value=saved[k]}el.addEventListener('input',()=>{saved[k]=el.type==='checkbox'?el.checked:el.value;localStorage.setItem('fortael-answers',JSON.stringify(saved))})});
function clearGroup(id){document.querySelectorAll('[data-key="'+id+'"],[data-key^="'+id+'-"]').forEach(el=>{if(el.type==='checkbox')el.checked=false;else el.value='';delete saved[el.dataset.key]});localStorage.setItem('fortael-answers',JSON.stringify(saved));const r=document.getElementById('result-'+id);if(r)r.textContent='';document.querySelectorAll('[id^="feedback-'+id+'-"]').forEach(e=>e.textContent='')}
function check(id){let n=0;correct[id].forEach((answer,i)=>{const el=document.querySelector('[data-key="'+id+'-'+i+'"]'),ok=el.value.trim().toLocaleLowerCase('da')===answer.toLocaleLowerCase('da');if(ok)n++;let fb=document.getElementById('feedback-'+id+'-'+i);if(!fb){fb=document.createElement('small');el.after(fb)}fb.textContent=ok?' ✓ Rigtigt':' ✗ Prøv igen. Rigtigt svar: '+answer;fb.className=ok?'ok':'bad'});document.getElementById('result-'+id).textContent=n+' af '+correct[id].length+' rigtige'}
let current=0;function move(n){current=(current+n+speak.length)%speak.length;document.getElementById('card').textContent=speak[current];document.getElementById('counter').textContent='Spørgsmål '+(current+1)+' af '+speak.length}
function exportAnswers(){let lines=['FORTÆL OM DIG SELV – MINE SVAR',''];pages.forEach((p,i)=>{if(!i)return;lines.push(p.title);document.querySelectorAll('#page'+i+' [data-key]').forEach(el=>lines.push(el.dataset.key+': '+(el.type==='checkbox'?(el.checked?'Ja':'Nej'):el.value)));lines.push('')});const a=document.createElement('a'),blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});a.href=URL.createObjectURL(blob);a.download='mine-danske-svar.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}show(0);
</script></body></html>
