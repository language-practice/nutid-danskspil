<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutid – 100 sætninger</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#253247;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#172c51;color:white;padding:26px max(20px,calc((100% - 940px)/2))}h1{margin:0 0 8px}.wrap{max-width:940px;margin:auto;padding:24px 18px 65px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tabs button,.actions button{font:inherit;font-weight:700;cursor:pointer;border:1px solid #cad6e6;border-radius:9px;padding:11px 15px;background:white;color:#233d62}.tabs .active,.actions .primary{background:#244b94;color:white}.panel{background:white;padding:24px;border:1px solid #dce5ef;border-radius:15px}.verbs{background:#eaf1fb;padding:16px;line-height:1.9;border-radius:12px;margin:20px 0}.question{display:block;border-bottom:1px solid #e8edf4;padding:13px 0;line-height:1.6}.question input{display:block;font:inherit;padding:9px 11px;width:min(100%,300px);border:1px solid #b9c9da;border-radius:8px;margin:6px 0}.question input.correct{border-color:#208552;background:#effbf3}.question input.wrong{border-color:#c36340;background:#fff4f0}.feedback{font-size:13px;color:#455b77}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.progress{height:9px;background:#dbe3ee;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#329974;width:0}.muted{color:#66788f;font-size:14px}@media print{header{background:white;color:black}.tabs,.actions,.progress{display:none}.panel{border:0;padding:0}.question{break-inside:avoid}input{border:0!important;border-bottom:1px solid black!important}}
</style></head><body><header><h1>Nutid – 100 sætninger</h1>Dansk som andetsprog · A1–A2 · 5 grupper á 20 sætninger</header><main class="wrap"><p><b>Opgave:</b> Find det rigtige udsagnsord på listen, og skriv det i nutid. Brug hvert udsagnsord én gang (nogle ord forekommer to gange). Du kan skifte frit mellem grupperne.</p><p id="total"></p><div class="progress"><div id="fill"></div></div><nav class="tabs" id="tabs"></nav><section class="panel" id="panel"></section></main><script>
const groups=[
{title:"Hverdag og rutiner",verbs:"vaske, gå, åbne, slutte, læse, sove, købe, rydde, børste, se, lave, drikke, spise, høre, køre, stå, tage, begynde, vågne, arbejde",sentences:["Jeg ___ klokken seks hver morgen.","Min mand ___ op klokken halv syv.","Vi ___ morgenmad sammen i køkkenet.","Hun ___ altid en kop kaffe om morgenen.","Børnene ___ tænder, før de går i skole.","Jeg ___ bussen til arbejde hver dag.","Min far ___ bil til sit kontor.","Min mor ___ på et hospital.","Undervisningen ___ klokken otte.","Min arbejdsdag ___ klokken fire.","Vi ___ ind i supermarkedet efter arbejde.","Min søster ___ aftensmad til hele familien.","Jeg ___ tøj hver lørdag.","Børnene ___ op på deres værelser.","Om aftenen ___ vi en film i fjernsynet.","Min bedstefar ___ avisen hver morgen.","Vores lille baby ___ to gange om dagen.","Jeg ___ en tur med hunden efter aftensmaden.","Hun ___ musik, mens hun gør rent.","Læreren ___ vinduet, fordi der er varmt i klassen."],answers:"vågner|står|spiser|drikker|børster|tager|kører|arbejder|begynder|slutter|køber|laver|vasker|rydder|ser|læser|sover|går|hører|åbner"},
{title:"Skole og arbejde",verbs:"lave, svare, arrangere, lægge, vente, låne, skrive, rette, lære, læse, stille, tale, tænde, diskutere, forklare, holde, kunne, forstå, øve, tegne",sentences:["Min bror ___ dansk på en sprogskole.","Læreren ___ en svær regel på tavlen.","Eleverne ___ mange spørgsmål i timen.","Jeg ___ en e-mail til min chef.","Min kollega ___ på min besked med det samme.","Vi ___ dansk sammen i pausen.","Min ven ___ engelsk og tysk.","Jeg ___ ikke dette danske ord.","Hun ___ på bussen ved stoppestedet.","Min søn ___ sin matematikbog i tasken.","Eleverne ___ en tekst højt i klassen.","Læreren ___ vores opgaver efter timen.","Jeg ___ mine nye ord hver aften.","Min datter ___ et flot billede i skolen.","Vi ___ en kort pause klokken ti.","Han ___ sine lektier efter aftensmaden.","Jeg ___ min computer, før mødet begynder.","Min chef ___ et møde hver mandag.","Hun ___ en ny bog på biblioteket.","Vi ___ meget, når vi laver gruppearbejde."],answers:"lærer|forklarer|stiller|skriver|svarer|taler|kan|forstår|venter|lægger|læser|retter|øver|tegner|holder|laver|tænder|arrangerer|låner|diskuterer"},
{title:"Familie og fritid",verbs:"arbejde, fejre, sidde, holde, fortælle, grine, hjælpe, græde, tage, glæde, invitere, lege, bo, besøge, savne, ringe, lede, give, have, give",sentences:["Min familie ___ i en lejlighed i København.","Min nabo ___ i en stor butik.","Min søster ___ to små børn.","Jeg ___ mine forældre hver søndag.","Mine børn ___ i haven efter skole.","Min mand ___ mig med madlavningen.","Vi ___ fødselsdag for min mor i dag.","Min bedstemor ___ en gave til sit barnebarn.","Jeg ___ min ven til middag på fredag.","Min far ___ ofte om sin barndom.","Vi ___ sammen ved spisebordet.","Min lillebror ___ tit, når han ser en sjov film.","Barnet ___, fordi det er træt og sultent.","Jeg ___ min søster, når hun er på ferie.","Min mor ___ mig altid et godt råd.","Vi ___ vores bedsteforældre i weekenden.","Min datter ___ sin bedste veninde i hånden.","Jeg ___ min telefon, fordi jeg ikke kan finde den.","Min bror ___ hjemmefra klokken syv.","Hele familien ___ sig til sommerferien."],answers:"bor|arbejder|har|ringer|leger|hjælper|fejrer|giver|inviterer|fortæller|sidder|griner|græder|savner|giver|besøger|holder|leder|tager|glæder"},
{title:"Vejr, ferie og rejser",verbs:"sne, opleve, bestille, rejse, svømme, pakke, arbejde, bo, kigge, tage, afgå, regne, bruge, læse, gå, spise, gå, komme, stå, tage",sentences:["Det ___ meget i Danmark om efteråret.","Solen ___ tidligt op om sommeren.","Om vinteren ___ det ofte i Norge.","Jeg ___ en varm jakke, når det er koldt.","Vi ___ til stranden, når vejret er godt.","Børnene ___ i havet om sommeren.","Min ven ___ lange ture i skoven.","Jeg ___ mange billeder på ferien.","Vi ___ på hotel, når vi rejser til udlandet.","Min mand ___ billetter til vores rejse.","Jeg ___ min kuffert dagen før afrejse.","Flyet ___ klokken ni om morgenen.","Vi ___ til Italien i sommerferien.","Min søster ___ nye steder på sine rejser.","Jeg ___ på et kort for at finde vejen.","Turisterne ___ rundt i den gamle bydel.","Vi ___ is, når solen skinner.","Min far ___ i haven, når det er varmt.","Jeg ___ en bog på stranden.","Vi ___ hjem efter en dejlig ferie."],answers:"regner|står|sner|bruger|tager|svømmer|går|tager|bor|bestiller|pakker|afgår|rejser|oplever|kigger|går|spiser|arbejder|læser|kommer"},
{title:"Indkøb, madlavning og hjemmet",verbs:"bære, vælge, spare, gøre, betale, lave, lægge, byde, skrælle, tage, handle, stille, komme, drikke, dække, sætte, stille, skære, låse, skære",sentences:["Jeg ___ i supermarkedet hver fredag.","Min ven ___ for sine varer med kort.","Vi ___ grøntsager til aftensmaden.","Min mor ___ suppe i en stor gryde.","Jeg ___ kartoflerne, før jeg koger dem.","Min søster ___ løg i små stykker.","Vi ___ bord, før gæsterne kommer.","Min mand ___ maden i ovnen.","Jeg ___ lidt salt i suppen.","Børnene ___ mælk til deres morgenmad.","Min far ___ brød med en skarp kniv.","Vi ___ vores gæster ved døren.","Jeg ___ opvasken efter aftensmaden.","Min datter ___ tallerkenerne ind i skabet.","Min søn ___ skraldet ud hver aften.","Vi ___ køkkenet rent efter madlavningen.","Jeg ___ døren, når jeg går hjemmefra.","Min nabo ___ sin cykel i kælderen.","Min ven ___ sin nøgle på bordet.","Vi ___ penge, fordi vi gerne vil købe et hus."],answers:"handler|betaler|vælger|laver|skræller|skærer|dækker|sætter|kommer|drikker|skærer|byder|tager|stiller|bærer|gør|låser|stiller|lægger|sparer"}
];let active=0;const key="nutid100v1";let stored;try{stored=JSON.parse(localStorage.getItem(key))}catch(e){}const responses=Array.from({length:5},(_,g)=>Array.from({length:20},(_,i)=>typeof stored?.[g]?.[i]==="string"?stored[g][i]:""));const el=id=>document.getElementById(id);const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;");function save(){try{localStorage.setItem(key,JSON.stringify(responses))}catch(e){}progress()}function progress(){let n=responses.flat().filter(x=>x.trim()).length;el("total").textContent="Samlet fremgang: "+n+" af 100 udfyldt";el("fill").style.width=n+"%";let p=el("progressGroup");if(p)p.textContent=responses[active].filter(x=>x.trim()).length+" af 20 udfyldt"}function render(){el("tabs").innerHTML=groups.map((g,i)=>'<button data-group="'+i+'" class="'+(active===i?"active":"")+'">Gruppe '+(i+1)+'</button>').join("");let g=groups[active];el("panel").innerHTML='<h2>Gruppe '+(active+1)+' – '+esc(g.title)+'</h2><div id="progressGroup" class="muted"></div><div class="verbs"><b>Udsagnsord</b><div>'+esc(g.verbs).replaceAll(","," ·")+'</div></div>'+g.sentences.map((s,i)=>'<label class="question"><b>'+(active*20+i+1)+'.</b> '+esc(s).replace("___","__________")+'<input data-index="'+i+'" autocomplete="off" spellcheck="false" placeholder="Skriv verbet i nutid" value="'+esc(responses[active][i])+'"><small class="feedback" id="feedback-'+i+'"></small></label>').join("")+'<div class="actions"><button class="primary" id="check">Tjek svar</button><button id="show">Vis facit</button><button id="reset">Slet alle svar i gruppen</button><button id="print">Udskriv</button></div><p id="summary" aria-live="polite"></p>';document.querySelectorAll(".question input").forEach(x=>x.addEventListener("input",e=>{let i=+e.target.dataset.index;responses[active][i]=e.target.value;e.target.classList.remove("correct","wrong");el("feedback-"+i).textContent="";el("summary").textContent="";save()}));el("check").onclick=()=>{let n=0;document.querySelectorAll(".question input").forEach((x,i)=>{let ok=x.value.trim().toLocaleLowerCase("da-DK")===g.answers.split("|")[i];if(ok)n++;x.classList.toggle("correct",ok);x.classList.toggle("wrong",!ok);el("feedback-"+i).textContent=ok?"✓ Rigtigt":x.value.trim()?"Prøv igen":"Mangler svar"});el("summary").textContent=n+" af 20 korrekte svar."};el("show").onclick=()=>g.answers.split("|").forEach((a,i)=>el("feedback-"+i).textContent="Facit: "+a);el("reset").onclick=()=>{responses[active].fill("");save();render()};el("print").onclick=()=>window.print();progress()}el("tabs").addEventListener("click",e=>{let b=e.target.closest("[data-group]");if(b){active=+b.dataset.group;render()}});render();
</script></body></html>
