<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nutid – Dansk grammatikspil</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#19334c;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.5;cursor:not-allowed}.app{max-width:1000px;margin:auto;padding:22px 16px 56px}.hero{background:#142c46;color:white;padding:27px;border-radius:20px}.hero small{color:#b9d0e5;font-weight:700;letter-spacing:.08em}.hero h1{font-size:clamp(32px,5vw,52px);margin:12px 0 3px}.hero p{color:#dbe6f3}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.metric{background:#294661;border-radius:10px;padding:12px;text-align:center}.metric strong{display:block;font-size:24px}.metric span{font-size:12px;color:#d9e5ef}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:17px 0}.nav button{border:2px solid #e0e7ef;background:white;border-radius:16px;text-align:left;padding:16px;color:inherit}.nav button.active{border-color:#177f6f;background:#ecf8f4}.nav .emoji{font-size:24px;display:block;margin-bottom:12px}.nav strong{display:block;font-size:15px}.nav small{display:block;color:#647586;margin-top:6px}.bar{height:6px;border-radius:5px;background:#e5ebf1;margin-top:12px;overflow:hidden}.bar>span{display:block;background:#1a9277;height:100%}.paper{background:#fff;border:1px solid #dbe4ed;border-radius:18px;padding:24px}.paper h2{margin:0 0 9px;font-size:26px}.muted{color:#5f7080}.info{background:#f0f5fa;border-radius:12px;padding:15px;margin:18px 0}.item{border-bottom:1px solid #e5ebf1;padding:17px 0}.item:last-child{border-bottom:0}.item p{font-weight:600;margin:0 0 11px}.item .controls{display:flex;gap:9px}input,textarea{border:1px solid #cbd6e1;border-radius:8px;padding:12px;width:100%;background:#fff;color:#19334c}input:focus,textarea:focus{outline:2px solid #64ad9e}textarea{min-height:240px;resize:vertical;line-height:1.6}.btn{background:#197e6d;color:white;padding:11px 18px;border-radius:9px;font-weight:650}.btn.secondary{background:#edf1f6;color:#23425a}.btn.danger{background:#fff1f0;color:#ad3030}.actionbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:18px 0}.feedback{font-size:14px;margin:7px 0}.correct{color:#13805d}.wrong{color:#bd3a35}.talk{border:1px solid #dae4ee;background:#f6f9fc;border-radius:14px;min-height:180px;padding:35px 20px;display:grid;place-content:center;text-align:center}.talk h3{font-size:25px;margin:0}.numbers{display:grid;grid-template-columns:repeat(15,minmax(34px,1fr));gap:6px;margin-top:18px}.numbers button{padding:9px 0;background:#edf2f6;border-radius:8px}.numbers .on{background:#197e6d;color:white}.numbers .spoken{border:2px solid #20926c}.checkrow{display:flex;align-items:center;gap:8px;padding:10px 0}.checkrow input{width:auto}.words{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.words span{padding:6px 9px;border-radius:12px;background:#dfece9;font-size:14px}footer{text-align:center;color:#738393;font-size:12px;padding-top:24px}.hidden{display:none!important}@media(max-width:710px){.nav{grid-template-columns:repeat(2,1fr)}.paper{padding:16px}.numbers{grid-template-columns:repeat(5,1fr)}.hero{padding:20px}}@media(max-width:400px){.metrics{gap:5px}.metric{padding:8px}.metric strong{font-size:19px}.nav button{padding:12px}}
</style></head><body><main class="app">
<header class="hero"><small>DANSK · A1–A2 · GRAMMATIKSPIL</small><h1>NUTID</h1><p>Øv dig i dansk! Vælg frit mellem fire opgaver. Dine svar gemmes i denne browser.</p><div class="metrics"><div class="metric"><strong id="score">0/35</strong><span>Rigtige svar</span></div><div class="metric"><strong id="talkscore">0/15</strong><span>Samtaler</span></div><div class="metric"><strong id="finished">0/4</strong><span>Færdige opgaver</span></div></div></header>
<nav class="nav" id="nav"></nav><section class="paper" id="work" aria-live="polite"></section>
<footer>Nutid · Dansk grammatikspil · Alle opgaver kan åbnes når som helst.</footer></main>
<script>
"use strict";
const verbs=[
["Jeg ___ morgenmad klokken syv.","spise","spiser"],["Min søster ___ i København.","bo","bor"],["Vi ___ dansk tre gange om ugen.","lære","lærer"],["Han ___ på en restaurant.","arbejde","arbejder"],["Børnene ___ i haven.","lege","leger"],["Jeg ___ kaffe om morgenen.","drikke","drikker"],["Min mor ___ aftensmad.","lave","laver"],["De ___ fjernsyn om aftenen.","se","ser"],["Du ___ meget hurtigt.","tale","taler"],["Vi ___ med bussen til skole.","køre","kører"],["Hun ___ en interessant bog.","læse","læser"],["Jeg ___ ikke tid i dag.","have","har"],["Min ven ___ meget træt.","være","er"],["Eleverne ___ deres lektier.","skrive","skriver"],["Han ___ en tur i parken.","gå","går"],["Jeg ___ indkøb hver lørdag.","gøre","gør"],["Vi ___ nye sko i butikken.","købe","køber"],["Læreren ___ et spørgsmål.","stille","stiller"],["Min bror ___ fodbold efter skole.","spille","spiller"],["De ___ på toget ved stationen.","vente","venter"],["Hun ___ en besked til sin ven.","sende","sender"],["Jeg ___ mine nøgler hver morgen.","finde","finder"],["Min far ___ tidligt hjem.","komme","kommer"],["Vi ___ musik, mens vi laver mad.","høre","hører"],["Han ___ sine venner i weekenden.","besøge","besøger"]];
const errors=[["Hun arbejde på et hospital.","arbejder"],["Min far køre på arbejde hver dag.","kører"],["De snakke dansk sammen.","snakker"],["Jeg har en hund, som hedde Max.","hedder"],["Vi spise frokost klokken tolv.","spiser"],["Han læse avisen hver morgen.","læser"],["Børnene lege udenfor.","leger"],["Min ven bo i Aarhus.","bor"],["Jeg skrive en e-mail til min lærer.","skriver"],["Hun gå til dans om tirsdagen.","går"]];
const questions=["Hvornår står du op om morgenen?","Hvad spiser du til morgenmad?","Hvordan kommer du i skole eller på arbejde?","Hvad laver du i din fritid?","Hvilke sprog taler du?","Hvad laver du normalt i weekenden?","Hvem laver mad hjemme hos dig?","Hvor ofte ser du film?","Hvad gør du, når du er træt?","Hvad kan du godt lide at lave med dine venner?","Hvad laver du normalt, når du kommer hjem fra skole eller arbejde?","Hvem taler du mest med i løbet af dagen?","Hvad gør du, når du har en fridag?","Hvordan øver du dig i dansk uden for undervisningen?","Hvad bruger du mest tid på i løbet af ugen?"];
const tasks=[["✏️","Skriv verbet i nutid","25 sætninger"],["🔎","Find fejlen","10 sætninger"],["💬","Tal sammen to og to","15 spørgsmål"],["📖","Skriv om din hverdag","Skriveopgave"]];
const initial=()=>({v:{},e:{},vc:{},ec:{},spoken:{},writing:"",checks:{},submitted:false});
let state=initial();try{const saved=JSON.parse(localStorage.getItem("nutid-game-v2"));if(saved&&typeof saved==="object")state={...state,...saved}}catch(e){}
let tab=0,qi=0;const $=id=>document.getElementById(id);
const norm=v=>String(v||"").trim().toLocaleLowerCase("da-DK").replace(/[.!?]+$/,"");
const esc=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{try{localStorage.setItem("nutid-game-v2",JSON.stringify(state))}catch(e){};stats()};
const correct=(set,checks,answers)=>set.filter((x,i)=>checks[i]&&norm(answers[i])===x[2===set[0].length?1:2]).length;
const vs=()=>verbs.filter((v,i)=>state.vc[i]&&norm(state.v[i])===v[2]).length;
const es=()=>errors.filter((v,i)=>state.ec[i]&&norm(state.e[i])===v[1]).length;
const spokenCount=()=>questions.filter((_,i)=>state.spoken[i]).length;
const filled=x=>Object.values(x).filter(v=>norm(v)).length;
const done=()=>[vs()===25,es()===10,spokenCount()===15,state.submitted].filter(Boolean).length;
function stats(){$("score").textContent=(vs()+es())+"/35";$("talkscore").textContent=spokenCount()+"/15";$("finished").textContent=done()+"/4";
const p=[filled(state.v),filled(state.e),spokenCount(),state.submitted?1:0],tot=[25,10,15,1];
$("nav").innerHTML=tasks.map((t,i)=>'<button type="button" class="'+(i===tab?'active':'')+'" data-tab="'+i+'"><span class="emoji">'+t[0]+'</span><strong>'+t[1]+'</strong><small>'+t[2]+'</small><div class="bar"><span style="width:'+(100*p[i]/tot[i])+'%"></span></div><small>'+(i===3?(state.submitted?"Færdig":(state.writing.trim()?state.writing.trim().split(/\s+/).length:0)+" ord"):p[i]+"/"+tot[i])+'</small></button>').join("");
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;render()})}
function resetButton(){return '<button type="button" class="btn danger" id="clearTask">🗑 Slet alle svar i denne opgave</button>'}
function attachReset(){ $("clearTask").onclick=()=>{if(!confirm("Vil du slette alle svar i denne opgave? De andre opgaver bliver ikke påvirket."))return;
if(tab===0){state.v={};state.vc={}}else if(tab===1){state.e={};state.ec={}}else if(tab===2){state.spoken={};qi=0}else{state.writing="";state.checks={};state.submitted=false}
save();render()}}
function render(){stats();const root=$("work");
if(tab<2){let list=tab===0?verbs:errors,answers=tab===0?state.v:state.e,checks=tab===0?state.vc:state.ec,score=tab===0?vs():es();
root.innerHTML='<h2>'+(tab===0?'1. Skriv verbet i nutid':'2. Find fejlen')+'</h2><p class="muted">'+(tab===0?'Skriv verbet fra parentesen i nutid.':'Der er ét verbum i forkert form i hver sætning. Skriv kun det rigtige verbum.')+'</p><div class="info">'+(tab===0?'Husk: De fleste verber får -r i nutid. at spise → spiser · at være → er · at have → har.':'Eksempel: Hun arbejde i en butik. → arbejder')+'</div><div class="actionbar"><strong>Point: <span id="points">'+score+'/'+list.length+'</span></strong><span class="muted">'+filled(answers)+' / '+list.length+' udfyldt</span></div>'+
list.map((v,i)=>'<div class="item"><p>'+(i+1)+'. '+esc(v[0])+(tab===0?' <span class="muted">('+esc(v[1])+')</span>':'')+'</p><div class="controls"><input aria-label="Svar '+(i+1)+'" data-answer="'+i+'" autocomplete="off" value="'+esc(answers[i]||'')+'" placeholder="Skriv verbet"><button type="button" class="btn secondary" data-check="'+i+'">Tjek</button></div><div class="feedback" id="feedback'+i+'"></div></div>').join("")+
'<div class="actionbar"><button class="btn" id="checkAll">Tjek alle svar</button>'+resetButton()+'</div>';
root.querySelectorAll("[data-answer]").forEach(inp=>inp.addEventListener("input",()=>{let i=inp.dataset.answer;answers[i]=inp.value;delete checks[i];$("feedback"+i).textContent="";save()}));
const show=i=>{const elem=$("feedback"+i);if(!norm(answers[i])){elem.textContent="Skriv et svar først.";elem.className="feedback muted";return}checks[i]=true;const good=norm(answers[i])===list[i][tab===0?2:1];elem.textContent=good?"✓ Rigtigt!":"✗ Ikke helt. Prøv igen.";elem.className="feedback "+(good?"correct":"wrong");save();$("points").textContent=(tab===0?vs():es())+"/"+list.length};
root.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>show(+b.dataset.check));$("checkAll").onclick=()=>list.forEach((v,i)=>show(i));list.forEach((v,i)=>{if(checks[i]){const el=$("feedback"+i),good=norm(answers[i])===v[tab===0?2:1];el.textContent=good?"✓ Rigtigt!":"✗ Ikke helt. Prøv igen.";el.className="feedback "+(good?"correct":"wrong")}});attachReset()
}else if(tab===2){root.innerHTML='<h2>3. Tal sammen to og to</h2><p>Arbejd sammen to og to. Stil spørgsmålene til hinanden, og svar med hele sætninger i nutid.</p><div class="info"><strong>Eksempel</strong><p>A: Hvad laver du efter skole?<br>B: Jeg går hjem, laver lektier og spiller computer.</p></div><div class="actionbar"><strong>Spørgsmål '+(qi+1)+' / 15</strong><span>'+spokenCount()+' gennemgået</span></div><div class="talk"><h3>'+esc(questions[qi])+'</h3></div><label class="checkrow"><input type="checkbox" id="spokenCheck" '+(state.spoken[qi]?'checked':'')+'>Vi har begge svaret på spørgsmålet.</label><div class="actionbar"><button class="btn secondary" id="previous" '+(qi===0?'disabled':'')+'>← Forrige</button><button class="btn" id="next" '+(qi===14?'disabled':'')+'>Næste →</button></div><div class="numbers">'+questions.map((q,i)=>'<button type="button" class="'+(qi===i?'on ':'')+(state.spoken[i]?'spoken':'')+'" data-question="'+i+'">'+(state.spoken[i]?'✓':i+1)+'</button>').join("")+'</div><div class="info">Ekstra: Stil et opfølgende spørgsmål, fx Hvorfor? Hvor ofte? Med hvem?</div><div class="actionbar">'+resetButton()+'</div>';
$("spokenCheck").onchange=e=>{state.spoken[qi]=e.target.checked;save();render()};$("previous").onclick=()=>{qi--;render()};$("next").onclick=()=>{qi++;render()};root.querySelectorAll("[data-question]").forEach(b=>b.onclick=()=>{qi=+b.dataset.question;render()});attachReset()
}else{const checks=[["a","Jeg har skrevet 8–12 sætninger."],["b","Jeg har brugt mindst otte forskellige verber."],["c","Jeg har kontrolleret verberne i nutid."],["d","Jeg har brugt punktum og store bogstaver."]];
root.innerHTML='<h2>4. Skriv om din hverdag</h2><p>Skriv 8–12 sætninger om din normale dag. Brug mindst otte forskellige verber i nutid.</p><div class="info"><strong>Du kan skrive om:</strong><p>Hvornår du står op · Hvad du spiser · Hvad du laver i skole eller på arbejde · Hvad du laver om eftermiddagen og aftenen</p><strong>Nyttige verber</strong><div class="words">'+["står op","spiser","drikker","tager","arbejder","studerer","kommer","laver","ser","går","sover"].map(w=>'<span>'+w+'</span>').join("")+'</div></div><div class="info"><strong>Eksempeltekst</strong><p>Jeg står op klokken syv hver morgen. Jeg spiser morgenmad sammen med min familie. Klokken otte tager jeg bussen til skole. Jeg lærer dansk og taler med mine venner. Efter skole går jeg hjem og laver mine lektier. Om aftenen ser jeg fjernsyn.</p></div><textarea id="writing" placeholder="Min hverdag...">'+esc(state.writing)+'</textarea><div class="actionbar"><span id="wordcount" class="muted"></span><button class="btn secondary" id="copy">Kopiér tekst</button></div><div class="info"><strong>Tjek din tekst</strong>'+checks.map(([k,v])=>'<label class="checkrow"><input type="checkbox" data-writingcheck="'+k+'" '+(state.checks[k]?'checked':'')+'>'+v+'</label>').join("")+'<button class="btn" id="submitText" '+(!state.writing.trim()||!checks.every(([k])=>state.checks[k])?'disabled':'')+'>'+(state.submitted?'✓ Teksten er færdig':'Markér min tekst som færdig')+'</button></div><div class="info">Ekstra: Brug ordene altid, normalt, ofte, nogle gange og aldrig.</div><div class="actionbar">'+resetButton()+'</div>';
const wc=()=>{const w=state.writing.trim()?state.writing.trim().split(/\s+/).length:0;$("wordcount").textContent=w+" ord";$("submitText").disabled=!state.writing.trim()||!checks.every(([k])=>state.checks[k])};
$("writing").oninput=e=>{state.writing=e.target.value;state.submitted=false;save();wc()};root.querySelectorAll("[data-writingcheck]").forEach(c=>c.onchange=e=>{state.checks[c.dataset.writingcheck]=e.target.checked;save();wc()});$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(state.writing);$("copy").textContent="Kopieret!"}catch(e){$("writing").select();document.execCommand("copy")}};$("submitText").onclick=()=>{state.submitted=true;save();render()};wc();attachReset()}
}
render();
</script></body></html>
